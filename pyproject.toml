[project]
name = "voice-assistant-qa"
version = "0.1.0"
description = "Voice Assistant QA Platform for clinic appointment booking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "python-multipart==0.0.12",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "loguru==0.7.3",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "jsonschema==4.23.0",
    "pytest==8.3.4",
    "pytest-asyncio==0.23.8",
    "pytest-cov==5.0.0",
    "httpx[http2]==0.28.1",
    "schemathesis==4.4.10",
    "playwright==1.49.0",
    "locust==2.32.1",
    "boto3==1.35.40",
    "duckdb==1.1.3",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "jiwer==3.0.4",
    "deep-eval==0.21.0",
    "ragas==0.2.12",
    "pydub==0.25.1",
    "audiomentations==0.34.0",
    "ffmpeg-python==0.2.0",
    "edge-tts==6.1.11",
    "prometheus-client==0.20.0",
    "pyyaml==6.0.1",
    "ruff==0.7.3",
    "black==24.10.0",
    "mypy==1.13.0",
    "types-requests==2.32.3",
]

[project.optional-dependencies]
dev = [
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "faker==33.1.0",
]
real-stt = [
    "faster-whisper==1.1.1",
]
real-llm = [
    "openai==1.54.4",
    "google-generativeai==0.8.3",
]
real-tts = [
    "piper-tts==1.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest-mock==3.14.0",
    "pytest-xdist==3.6.1",
    "faker==33.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "B", "C4", "PT", "T20", "SIM", "ARG"]
ignore = ["S101", "PT011"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"