name: Voice Assistant QA Platform - CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # PR Checks - run on every PR
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run ruff
        run: uv run ruff check .
      
      - name: Run black (check)
        run: uv run black --check .
      
      - name: Run mypy
        run: uv run mypy app/

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run unit tests
        run: uv run pytest tests/ -v --tb=short -m "not api and not ui and not perf" -x
        env:
          STT_ADAPTER: mock
          LLM_ADAPTER: mock
          TTS_ADAPTER: mock
          API_KEY: test-api-key
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run API tests
        run: uv run pytest tests/api/ -v --tb=short
        env:
          STT_ADAPTER: mock
          LLM_ADAPTER: mock
          TTS_ADAPTER: mock
          API_KEY: test-api-key
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  smoke-eval:
    name: Smoke Evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run smoke eval (15 cases)
        run: |
          uv run pytest tests/llm_eval/test_smoke.py -v --tb=short
        env:
          STT_ADAPTER: mock
          LLM_ADAPTER: mock
          TTS_ADAPTER: mock
          API_KEY: test-api-key
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  safety-tests:
    name: Safety Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Run safety smoke tests
        run: uv run pytest tests/safety/ -v --tb=short -k "smoke"
        env:
          STT_ADAPTER: mock
          LLM_ADAPTER: mock
          TTS_ADAPTER: mock
          API_KEY: test-api-key
          DATABASE_URL: sqlite+aiosqlite:///:memory:

  playwright-smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Install Playwright browsers
        run: uv run playwright install chromium
      
      - name: Start server
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          STT_ADAPTER: mock
          LLM_ADAPTER: mock
          TTS_ADAPTER: mock
          API_KEY: test-api-key
          DATABASE_URL: sqlite+aiosqlite:///:memory:
      
      - name: Run Playwright smoke tests
        run: uv run pytest tests/ui/ -v --tb=short -k "smoke" --headed=false
        env:
          BASE_URL: http://localhost:8000
      
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/ui/traces/
          retention-days: 7

  # Nightly - full test suite
  nightly-full-eval:
    name: Nightly Full Evaluation
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --extra real-stt --extra real-llm --extra real-tts
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Run full golden dataset eval
        run: |
          uv run pytest tests/llm_eval/ -v --tb=short --html=reports/llm_eval/nightly_report.html --self-contained-html
        env:
          STT_ADAPTER: faster-whisper
          LLM_ADAPTER: openai
          TTS_ADAPTER: edge-tts
          API_KEY: ${{ secrets.API_KEY }}
          DATABASE_URL: sqlite+aiosqlite:///./data/app.db
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: Upload eval reports to S3
        run: |
          aws s3 sync reports/ s3://${{ secrets.S3_BUCKET }}/reports/$(date +%Y-%m-%d)/ --delete

  nightly-playwright:
    name: Nightly Playwright Suite
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Install Playwright browsers
        run: uv run playwright install chromium firefox webkit
      
      - name: Start server
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          STT_ADAPTER: mock
          LLM_ADAPTER: mock
          TTS_ADAPTER: mock
          API_KEY: test-api-key
          DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      
      - name: Run full Playwright suite
        run: uv run pytest tests/ui/ -v --tb=short --headed=false
        env:
          BASE_URL: http://localhost:8000
      
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-traces
          path: tests/ui/traces/
          retention-days: 30
      
      - name: Upload to S3
        if: always()
        run: |
          aws s3 sync tests/ui/traces/ s3://${{ secrets.S3_BUCKET }}/reports/$(date +%Y-%m-%d)/ui_traces/ --delete

  nightly-locust:
    name: Nightly Load Test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Start server
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          STT_ADAPTER: mock
          LLM_ADAPTER: mock
          TTS_ADAPTER: mock
          API_KEY: test-api-key
          DATABASE_URL: sqlite+aiosqlite:///./data/app.db
      
      - name: Run Locust load test
        run: |
          uv run locust -f tests/perf/locustfile.py --headless -u 20 -r 5 -t 60s --host http://localhost:8000 --html reports/perf/locust_report.html
        env:
          BASE_URL: http://localhost:8000
      
      - name: Upload Locust report
        uses: actions/upload-artifact@v4
        with:
          name: locust-report
          path: reports/perf/locust_report.html
          retention-days: 30
      
      - name: Upload to S3
        run: |
          aws s3 cp reports/perf/locust_report.html s3://${{ secrets.S3_BUCKET }}/reports/$(date +%Y-%m-%d)/locust_report.html

  # Promptfoo regression (run on PR + nightly)
  promptfoo-regression:
    name: Prompt Regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: promptfoo/package-lock.json
      
      - name: Install promptfoo
        run: cd promptfoo && npm ci
      
      - name: Run promptfoo eval
        run: cd promptfoo && npx promptfoo eval -c promptfooconfig.yaml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: Upload promptfoo report
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-report
          path: promptfoo/reports/
          retention-days: 30

  # Notify on failure
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, api-tests, smoke-eval, safety-tests, playwright-smoke]
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#qa-alerts'
          text: "PR #${{ github.event.number }} failed checks"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

  notify-nightly-failure:
    name: Notify Nightly Failure
    runs-on: ubuntu-latest
    needs: [nightly-full-eval, nightly-playwright, nightly-locust, promptfoo-regression]
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          channel: '#qa-alerts'
          text: "Nightly QA run failed"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true